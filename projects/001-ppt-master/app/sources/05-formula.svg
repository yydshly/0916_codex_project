<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="zh-CN" font-family="Microsoft YaHei" font-size="28"><rect x="0" y="0" width="1280" height="720" fill="#F6F8F5" /><text x="70" y="84" font-size="42" fill="#142C35" font-weight="bold" >公式：结构化数学表达式</text><text x="72" y="133" font-size="23" fill="#526C73" font-weight="normal" >SVG 中显示文本预览；PPTX 中输出可编辑的 Office Math</text><g id="quadratic-formula" data-pptx-replace-with="formula" data-pptx-bounds="170 225 940 180" data-pptx-x="170" data-pptx-y="225" data-pptx-width="940" data-pptx-height="180"><metadata type="application/json">{&quot;latex&quot;: &quot;x = \\frac{-b \\pm \\sqrt{b^2-4ac}}{2a}&quot;, &quot;display&quot;: &quot;block&quot;, &quot;font_size&quot;: 52, &quot;color&quot;: &quot;#142C35&quot;, &quot;align&quot;: &quot;center&quot;}</metadata><text x="640" y="348" font-size="48" fill="#142C35" font-weight="normal" text-anchor="middle">x = (−b ± √(b² − 4ac)) / 2a</text></g><text x="100" y="492" font-size="36" fill="#007F73" font-weight="bold" >LaTeX → Office Math</text><text x="100" y="552" font-size="27" fill="#526C73" font-weight="normal" >分数、根号与上下标以原生公式结构保存。</text><text x="100" y="600" font-size="25" fill="#526C73" font-weight="normal" >在 PowerPoint 中选中公式，继续修改数学表达式。</text><line x1="72" y1="650" x2="1208" y2="650" stroke="#CFDAD7" stroke-width="2"/><text x="72" y="686" font-size="17" fill="#526C73" font-weight="normal" >PPT MASTER / 本地能力实验 · 示例数据</text><text x="1208" y="686" font-size="17" fill="#526C73" font-weight="normal" text-anchor="end">05 / 05</text></svg>